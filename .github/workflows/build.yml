# 本配置适用于 GitHub Actions
# 适用于：ios | 技术栈：native_ios

name: Build AudioAndVideoPlay

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Install Apple Certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install Provisioning Profile
        run: |
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Generate ExportOptions.plist
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>67RLJX8U9X</string>
            <key>provisioningProfiles</key>
            <dict>
                <key>com.chengcheng.zeo</key>
                <string>OOQ_ADHoc</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF

      - name: Build iOS
        run: |
          WS=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          PROJ=$(ls -d *.xcodeproj 2>/dev/null | head -n 1)
          if [ -n "$WS" ]; then
            TARGET="-workspace $WS"
            SCHEME=$(basename "$WS" .xcworkspace)
          elif [ -n "$PROJ" ]; then
            TARGET="-project $PROJ"
            SCHEME=$(basename "$PROJ" .xcodeproj)
          else
            echo "::error::未找到 .xcworkspace 或 .xcodeproj，无法继续构建"
            exit 1
          fi
          echo "构建目标：$TARGET | Scheme：$SCHEME"
          mkdir -p build/ipa
          
          # 编译并归档（注入签名参数）
          xcodebuild $TARGET -scheme "$SCHEME" -configuration Release -sdk iphoneos -archivePath "build/$SCHEME.xcarchive" archive CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=67RLJX8U9X PROVISIONING_PROFILE_SPECIFIER="OOQ_ADHoc"
          
          # 导出 IPA（读取上面的 ExportOptions.plist）
          xcodebuild -exportArchive -archivePath "build/$SCHEME.xcarchive" -exportOptionsPlist ExportOptions.plist -exportPath build/ipa
