name: Build iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 安装证书 (使用 Secrets)
      - name: Install Apple Certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      # 2. 安装描述文件 (使用 Secrets)
      - name: Install Provisioning Profile
        run: |
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      # 3. 编译并导出 ipa (已修正为 -project 且移除了写死的 Xcode 版本)
      - name: Build and Export IPA
        run: |
          xcodebuild -project AudioAndVideoPlay.xcodeproj -scheme AudioAndVideoPlay -configuration Release -sdk iphoneos -archivePath build/AudioAndVideoPlay.xcarchive archive
          xcodebuild -exportArchive -archivePath build/AudioAndVideoPlay.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/ipa
      
      # 4. 上传打包产物 (新增，方便你下载)
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App
          path: build/ipa/*.ipa