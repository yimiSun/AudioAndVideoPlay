# 本配置适用于 GitHub Actions
# 适用于：ios | 技术栈：native_ios

name: Build AudioAndVideoPlay

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Install Apple Certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install Provisioning Profile
        run: |
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Generate ExportOptions.plist
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>67RLJX8U9X</string>
            <key>provisioningProfiles</key>
            <dict>
                <key>com.chengcheng.zeo</key>
                <string>OOQ_ADHoc</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF

      - name: Build iOS
        run: |
          WS=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          PROJ=$(ls -d *.xcodeproj 2>/dev/null | head -n 1)
          if [ -n "$WS" ]; then
            TARGET="-workspace $WS"
            SCHEME=$(basename "$WS" .xcworkspace)
          elif [ -n "$PROJ" ]; then
            TARGET="-project $PROJ"
            SCHEME=$(basename "$PROJ" .xcodeproj)
          else
            echo "::error::未找到工程文件"
            exit 1
          fi
          
          # 【新增这一行】暴力把工程里的所有 7.0 替换成 12.0
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/g' $(find . -name project.pbxproj)

          echo "构建目标：$TARGET | Scheme：$SCHEME"
          mkdir -p build/ipa
          xcodebuild $TARGET -scheme "$SCHEME" -configuration Release -sdk iphoneos -archivePath "build/$SCHEME.xcarchive" archive CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=67RLJX8U9X PROVISIONING_PROFILE_SPECIFIER="OOQ_ADHoc" PRODUCT_BUNDLE_IDENTIFIER="com.chengcheng.zeo" CODE_SIGN_IDENTITY="Apple Distribution" IPHONEOS_DEPLOYMENT_TARGET=12.0
